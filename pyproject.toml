[project]
name = "market-data"
version = "0.1.0"
description = "Financial data scraper and analysis tool"
requires-python = ">=3.13"
dependencies = [
    "pandas>=2.0.0",
    "yfinance>=0.2.32",
    "beautifulsoup4>=4.13.0",
    "requests>=2.31.0",
    "lxml>=4.9.0",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
